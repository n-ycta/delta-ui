name: Verify shared UI
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path crates/app-runtime/Cargo.toml
      - run: npm ci --ignore-scripts
      - run: npm test && npm run test:apps && npm run test:i18n && npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:navigation && npm run test:onboarding && npm run test:language && npm run test:profile && npm run test:embedding
      - uses: actions/upload-artifact@v4
        with:
          name: delta-ui-bundled-preview
          path: dist
