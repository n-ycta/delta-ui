[package]
name = "delta-native-host"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
delta-host-runtime = {git="https://github.com/n-ycta/delta",rev="08b94a2ffe5a6bac6209bfaeb2778647b275a14f"}
