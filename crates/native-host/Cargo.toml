[package]
name = "delta-native-host"
version = "0.1.1"
edition = "2021"
license = "Apache-2.0"

[dependencies]
delta-app-runtime = {path="../app-runtime"}
delta-native-update = {path="../native-update",features=["net"]}
reqwest = {version="0.12",default-features=false,features=["rustls-tls"]}
delta-host-runtime = {git="https://github.com/n-ycta/delta",rev="4d970f1ddb23a3c152ffacf743955871d59b71eb"}
serde_json = "1"
tauri = {version="2",features=[]}

[target.'cfg(not(target_os = "android"))'.dependencies]
delta-host-runtime = {git="https://github.com/n-ycta/delta",rev="4d970f1ddb23a3c152ffacf743955871d59b71eb",features=["desktop"]}
tauri = {version="2",features=["tray-icon"]}

[target.'cfg(not(target_os = "android"))'.dependencies.tauri-plugin-single-instance]
version="2"
[target.'cfg(not(target_os = "android"))'.dependencies.tauri-plugin-autostart]
version="2"
[target.'cfg(not(target_os = "android"))'.dependencies.tauri-plugin-dialog]
version="2"
[target.'cfg(not(target_os = "android"))'.dependencies.tauri-plugin-opener]
version="2"
[target.'cfg(not(target_os = "android"))'.dependencies.tauri-plugin-notification]
version="2"
[target.'cfg(target_os = "android")'.dependencies]
jni="0.21"
tokio={version="1",features=["rt-multi-thread"]}
