tauri = {version="2",features=[]}

[target.'cfg(not(target_os = "android"))'.dependencies]
delta-host-runtime = {git="https://github.com/n-ycta/delta",rev="08b94a2ffe5a6bac6209bfaeb2778647b275a14f",features=["desktop"]}
tauri = {version="2",features=["tray-icon"]}
